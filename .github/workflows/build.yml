name: Build Foudre-Core

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:                 # mesures du banc verifiees sur des signaux connus (quelques secondes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests sans JUCE
        run: bash tools/tests/run.sh

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target FoudreBanc --parallel

      - name: Upload foudre-banc
        uses: actions/upload-artifact@v4
        with:
          name: foudre-banc-Windows
          path: build/banc/FoudreBanc_artefacts/Release/foudre-banc.exe
